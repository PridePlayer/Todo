packages:
  - "apps/*"
  - "packages/*"

# 供应链防护（minimumReleaseAge）会拒绝"刚发布不到 N 小时"的包，防止抢注投毒。
# 这三个是传递依赖、只在构建期用（不进 APK 运行时），但版本号恰好卡在 cutoff 内，
# EAS 云端构建会因此直接失败。排除 age 检查，不降级版本。
minimumReleaseAgeExclude:
  - caniuse-lite
  - multitars
  - node-forge

# pnpm 10 默认不运行依赖的 install 脚本（防供应链攻击），被忽略的包会让 install 以 1 退出。
# esbuild 是 vite 的依赖（web 端用），移动端打包走 Metro，完全用不到它 ——
# 所以这里明确"忽略"而不是"放行"：既让 install 通过，也不给它运行脚本的机会。
ignoredBuiltDependencies:
  - esbuild

# pnpm 10 默认 strictDepBuilds：依赖的 install 脚本没在白名单里就不执行，
# **并且让 install 以 1 退出**。ignoredBuiltDependencies 在云端未被采纳，
# 所以直接关严格模式 —— 脚本仍然不执行（安全），但不阻断安装。
# esbuild 本就是 vite 的依赖、移动端用 Metro 打包用不到它。
strictDepBuilds: false
