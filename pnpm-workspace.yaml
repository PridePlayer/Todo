packages:
  - "apps/*"
  - "packages/*"

# 供应链防护（minimumReleaseAge）会拒绝"刚发布不到 N 小时"的包，防止抢注投毒。
# 这三个是传递依赖、只在构建期用（不进 APK 运行时），但版本号恰好卡在 cutoff 内，
# EAS 云端构建会因此直接失败。排除 age 检查，不降级版本。
minimumReleaseAgeExclude:
  - caniuse-lite
  - multitars
  - node-forge

# pnpm 10 默认不运行依赖的 install 脚本（防供应链攻击）。
# esbuild 的脚本是下载平台二进制，必须放行，否则 install 直接以 1 退出。
# 注意：package.json 的 pnpm 字段已不被读取（见 install 时的 WARN），只能写在这里。
onlyBuiltDependencies:
  - esbuild
